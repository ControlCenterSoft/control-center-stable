name: Publish Control Center 0.27.0 Public Stable

on:
  push:
    branches:
      - publication/v0.27.0

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-control-center-stable-0.27.0
  cancel-in-progress: false

env:
  VERSION: 0.27.0
  STABLE_SHA: 8dd62d6560c4c7a7125ea8901e839ca958e3cbe1
  SOURCE_SHA: e5a39243e16d8540b79822dc85d8544f24d12725
  QUALIFICATION_RUN_ID: '34637701427'
  QUALIFICATION_HEAD_SHA: 0c5be26fc267cd45e8e7cee3fbd9205e60491277

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release identity and green qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > /tmp/run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/run.json', encoding='utf-8'))
          assert r.get('status') == 'completed', r.get('status')
          assert r.get('conclusion') == 'success', r.get('conclusion')
          assert r.get('head_sha') == os.environ['QUALIFICATION_HEAD_SHA'], r.get('head_sha')
          print('QUALIFICATION=PASS')
          PY

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.STABLE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify exact Stable tree and public documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$STABLE_SHA"
          test "$(tr -d '\n' < VERSION)" = "$VERSION"
          grep -F '"qualification_result": "success"' RELEASE-MANIFEST.json
          grep -F "$SOURCE_SHA" RELEASE-MANIFEST.json
          grep -q '0.27.0' README.md
          grep -q '0.27.0' INSTALL.md
          grep -q '0.27.0' RELEASE_NOTES.md
          grep -q 'Public Stable.*0.27.0\|0.27.0.*Public Stable' ROADMAP.md
          ! grep -RInE --include='*.md' '(Gemini|AI Development Infrastructure|Orchestrator|CI Fabric|GitHub[ -]hosted runner|192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+)' README.md INSTALL.md RELEASE_NOTES.md ROADMAP.md docs/RELEASE_0.27.0_RU.md
          make fmt-check
          go vet ./...
          go test ./...
          go build -trimpath -buildvcs=false ./cmd/control-center

      - name: Build release assets and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" COMMIT="$SOURCE_SHA" bash scripts/build-release.sh
          (cd dist && sha256sum -c "control-center-${VERSION}-linux-amd64.tar.gz.sha256")
          git archive --format=tar.gz --prefix="control-center-${VERSION}-source/" -o "dist/control-center-${VERSION}-source.tar.gz" "$STABLE_SHA"
          cp RELEASE-MANIFEST.json "dist/control-center-${VERSION}.release-manifest.json"
          printf '{"schema":"control-center.stable-qualification.v1","version":"%s","result":"pass","qualification_run_id":%s,"source_commit":"%s","stable_commit":"%s"}\n' "$VERSION" "$QUALIFICATION_RUN_ID" "$SOURCE_SHA" "$STABLE_SHA" > "dist/control-center-${VERSION}.qualification.json"
          printf '{"schema":"control-center.stable-provenance.v1","version":"%s","source_tag":"v%s","source_commit":"%s","stable_commit":"%s","qualification_run_id":%s}\n' "$VERSION" "$VERSION" "$SOURCE_SHA" "$STABLE_SHA" "$QUALIFICATION_RUN_ID" > "dist/control-center-${VERSION}.provenance.json"
          (cd dist && sha256sum \
            "control-center-${VERSION}-linux-amd64.tar.gz" \
            "control-center-${VERSION}-linux-amd64.tar.gz.sha256" \
            "control-center-${VERSION}-source.tar.gz" \
            "control-center-${VERSION}.release-manifest.json" \
            "control-center-${VERSION}.qualification.json" \
            "control-center-${VERSION}.provenance.json" > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish immutable tag and GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$STABLE_SHA" -m "Control Center $VERSION Public Stable"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            "dist/control-center-${VERSION}-linux-amd64.tar.gz" \
            "dist/control-center-${VERSION}-linux-amd64.tar.gz.sha256" \
            "dist/control-center-${VERSION}-source.tar.gz" \
            "dist/control-center-${VERSION}.release-manifest.json" \
            "dist/control-center-${VERSION}.qualification.json" \
            "dist/control-center-${VERSION}.provenance.json" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Control Center $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-0.27.0-public-stable-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
