name: Qualify Control Center Stable 0.30.0

on:
  push:
    branches:
      - qualification/stable-0.30.0

permissions:
  contents: read

concurrency:
  group: qualify-control-center-stable-0.30.0
  cancel-in-progress: false

env:
  VERSION: 0.30.0
  UPSTREAM_REPOSITORY: ControlCenterSoft/control-center-development
  UPSTREAM_TAG: v0.30.0
  UPSTREAM_SHA: a4851fd0b35a3bbb836426f68ce859caf780e829

jobs:
  provenance-safety:
    name: Provenance, public safety and release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact immutable official source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(tr -d '\n' < source/VERSION)" = "$VERSION"
          git -C source tag --points-at HEAD | grep -Fx "$UPSTREAM_TAG"
          test ! -f source/.env
          test ! -f source/.env.staging
          test -f source/README.md
          test -f source/SECURITY.md
          test -f source/ROADMAP.md
          test -f source/docs/RELEASE_0.30.0_RU.md
      - name: Scan public source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.sum' --exclude='ci.yml' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|sk-(proj-)?[A-Za-z0-9_-]{24,})' source; then
            echo 'public-safety scan detected credential-like material' >&2
            exit 1
          fi
      - name: Verify immutable remote tag
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote "https://github.com/$UPSTREAM_REPOSITORY.git" "refs/tags/$UPSTREAM_TAG" | awk '{print $1}')"
          test "$remote_sha" = "$UPSTREAM_SHA"

  static-unit-build:
    name: Format, vet, unit, contracts and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact immutable official source
        run: git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true
      - name: Verify revision
        run: test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Format
        working-directory: source
        run: make fmt-check
      - name: Vet
        working-directory: source
        run: go vet ./...
      - name: Unit and contract tests
        working-directory: source
        run: go test ./...
      - name: Build
        working-directory: source
        run: go build -trimpath -buildvcs=false ./cmd/control-center

  postgres-migrations:
    name: PostgreSQL ${{ matrix.postgres }} / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        postgres: ['15', '16', '17', '18']
        scenario: [clean-install, supported-upgrade]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact immutable official source
        run: git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true
      - name: Verify revision and migration scenario
        shell: bash
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
          QUALIFICATION_SCENARIO: ${{ matrix.scenario }}
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          case "$QUALIFICATION_SCENARIO" in
            clean-install) qualification_test=TestPostgresCleanInstallAndRestart ;;
            supported-upgrade) qualification_test=TestPostgresUpgradeFrom03PreservesLegacyState ;;
            *) exit 2 ;;
          esac
          go test ./migrations -run "^${qualification_test}$" -count=1 -v

  postgres-adapters:
    name: PostgreSQL ${{ matrix.postgres }} adapters/restart
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        postgres: ['15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact immutable official source
        run: git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true
      - name: Verify exact revision
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install current schema
        working-directory: source
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1 -v
      - name: Verify PostgreSQL adapters and restart recovery
        working-directory: source
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./internal/persistence/postgres -run '^TestPostgres' -count=1 -v

  race:
    name: Race detector and restart safety
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact immutable official source
        run: git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true
      - name: Install current schema
        working-directory: source
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1
      - name: Run race detector
        working-directory: source
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test -race -count=1 ./...

  reproducible-package:
    name: Reproducible Linux package and checksum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [provenance-safety, static-unit-build]
    steps:
      - name: Checkout exact immutable official source
        run: git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true
      - name: Build deterministic distribution twice
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          epoch="$(git -C source show -s --format=%ct HEAD)"
          for n in 1 2; do
            stage="stage-$n/control-center-$VERSION"
            mkdir -p "$stage/bin" "$stage/api" "$stage/migrations"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C source -trimpath -buildvcs=false -o "../$stage/bin/control-center" ./cmd/control-center
            cp source/README.md source/SECURITY.md source/ARCHITECTURE.md source/ROADMAP.md source/VERSION "$stage/"
            cp -a source/api/. "$stage/api/"
            find source/migrations -maxdepth 1 -type f \( -name '*.sql' -o -name 'README.md' \) -exec cp {} "$stage/migrations/" \;
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -C "stage-$n" -czf "control-center-$VERSION-$n-linux-amd64.tar.gz" "control-center-$VERSION"
          done
          cmp "control-center-$VERSION-1-linux-amd64.tar.gz" "control-center-$VERSION-2-linux-amd64.tar.gz"
          mv "control-center-$VERSION-1-linux-amd64.tar.gz" "control-center-$VERSION-linux-amd64.tar.gz"
          sha256sum "control-center-$VERSION-linux-amd64.tar.gz" > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '{"schema":"control-center.stable-qualification.v1","version":"%s","upstream_tag":"%s","upstream_commit":"%s","result":"qualified-package-candidate"}\n' "$VERSION" "$UPSTREAM_TAG" "$UPSTREAM_SHA" > qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-stable-0.30.0-qualification-${{ github.run_id }}
          path: |
            control-center-0.30.0-linux-amd64.tar.gz
            SHA256SUMS
            qualification.json
          if-no-files-found: error
          retention-days: 7

  qualification-gate:
    name: Stable qualification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [provenance-safety, static-unit-build, postgres-migrations, postgres-adapters, race, reproducible-package]
    steps:
      - name: Record green stable qualification
        run: echo "Control Center $VERSION exact source $UPSTREAM_SHA passed independent Public Stable qualification."
