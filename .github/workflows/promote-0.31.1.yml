name: Promote Control Center 0.31.1

on:
  push:
    branches:
      - promotion/0.31.1
    paths:
      - .github/workflows/promote-0.31.1.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-control-center-0.31.1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: 0.31.1
      RELEASE_SHA: 3c9999fb5b056dad9d8dda9cf45809acb021497e
      QUALIFICATION_RUN_ID: '34743442163'
      QUALIFIED_HEAD_SHA: 72fd0899c63ee11d2b743fce197e35ae865ed71f
      QUALIFIED_MERGE_SHA: 561a3eb8c4b9fb3f7767b86665570a91842feef6
      QUALIFICATION_ARTIFACT: control-center-stable-561a3eb8c4b9fb3f7767b86665570a91842feef6
    steps:
      - name: Checkout exact promoted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Bind promotion to qualified tree and immutable inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="v${RELEASE_VERSION}"
          test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          main_sha="$(gh api "repos/${repo}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RELEASE_SHA"
          run_conclusion="$(gh api "repos/${repo}/actions/runs/${QUALIFICATION_RUN_ID}" --jq '.conclusion')"
          run_head="$(gh api "repos/${repo}/actions/runs/${QUALIFICATION_RUN_ID}" --jq '.head_sha')"
          test "$run_conclusion" = success
          test "$run_head" = "$QUALIFIED_HEAD_SHA"
          changed_from_head="$(gh api "repos/${repo}/compare/${QUALIFIED_HEAD_SHA}...${RELEASE_SHA}" --jq '.files | length')"
          changed_from_merge="$(gh api "repos/${repo}/compare/${QUALIFIED_MERGE_SHA}...${RELEASE_SHA}" --jq '.files | length')"
          test "$changed_from_head" = 0
          test "$changed_from_merge" = 0
          artifact_count="$(gh api "repos/${repo}/actions/runs/${QUALIFICATION_RUN_ID}/artifacts" --jq "[.artifacts[] | select(.name == \"${QUALIFICATION_ARTIFACT}\" and .expired == false)] | length")"
          test "$artifact_count" = 1
          if gh api "repos/${repo}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists" >&2
            exit 1
          fi
          if gh api "repos/${repo}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists without the intended release" >&2
            exit 1
          fi
          git diff --quiet v0.31.0 "$RELEASE_SHA" -- go.mod go.sum third_party
          echo QUALIFIED_TREE_IDENTITY=PASS
          echo DEPENDENCY_SET_UNCHANGED_FROM_0_31_0=PASS

      - name: Build final Linux package and source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist/publish
          mkdir -p dist/publish
          epoch="$(git show -s --format=%ct "$RELEASE_SHA")"
          DIST_DIR="$PWD/dist/publish" SOURCE_DATE_EPOCH="$epoch" COMMIT="$RELEASE_SHA" bash scripts/build-release.sh
          bundle="control-center-${RELEASE_VERSION}"
          artifact="dist/publish/${bundle}-linux-amd64.tar.gz"
          sidecar="${artifact}.sha256"
          (cd dist/publish && sha256sum -c "$(basename "$sidecar")")
          tar -tzf "$artifact" | grep -Fx "${bundle}/scripts/migrate.sh" >/dev/null
          tar -tzf "$artifact" | grep -Fx "${bundle}/bin/control-center" >/dev/null
          test "$(tar -xOf "$artifact" "${bundle}/VERSION" | tr -d '\r\n')" = "$RELEASE_VERSION"
          git archive --format=tar.gz --prefix="control-center-${RELEASE_VERSION}-source/" "$RELEASE_SHA" > "dist/publish/control-center-${RELEASE_VERSION}-source.tar.gz"
          test -s "dist/publish/control-center-${RELEASE_VERSION}-source.tar.gz"

      - name: Generate SBOM and release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cp THIRD_PARTY_NOTICES.md dist/publish/THIRD_PARTY_NOTICES.md
          python3 - <<'PY'
          import hashlib, json, pathlib, uuid
          version = "0.31.1"
          release_sha = "3c9999fb5b056dad9d8dda9cf45809acb021497e"
          qualified_head = "72fd0899c63ee11d2b743fce197e35ae865ed71f"
          qualified_merge = "561a3eb8c4b9fb3f7767b86665570a91842feef6"
          run_id = 34743442163
          out = pathlib.Path("dist/publish")
          manifest = json.loads(pathlib.Path("third_party/manifest-0.31.json").read_text(encoding="utf-8"))
          components = []
          for item in manifest["components"]:
              components.append({
                  "type": "library",
                  "bom-ref": item["purl"],
                  "name": item["module"],
                  "version": item["version"],
                  "purl": item["purl"],
                  "licenses": [{"license": {"id": item["license_spdx"]}}],
                  "properties": [
                      {"name": "control-center:scope", "value": item["scope"]},
                      {"name": "control-center:source", "value": item["source"]},
                      {"name": "control-center:license-sha256", "value": item["license_sha256"]},
                  ],
              })
          sbom = {
              "$schema": "https://cyclonedx.org/schema/bom-1.7.schema.json",
              "bomFormat": "CycloneDX",
              "specVersion": "1.7",
              "serialNumber": "urn:uuid:" + str(uuid.uuid5(uuid.NAMESPACE_URL, f"control-center:{version}:{release_sha}")),
              "version": 1,
              "metadata": {"component": {"type": "application", "name": "control-center", "version": version,
                  "properties": [{"name": "control-center:release-sha", "value": release_sha}]}},
              "components": components,
          }
          (out / f"control-center-{version}.sbom.cdx.json").write_text(json.dumps(sbom, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")

          def digest(name):
              return "sha256:" + hashlib.sha256((out / name).read_bytes()).hexdigest()

          binary = f"control-center-{version}-linux-amd64.tar.gz"
          sidecar = binary + ".sha256"
          source = f"control-center-{version}-source.tar.gz"
          sbom_name = f"control-center-{version}.sbom.cdx.json"
          notices = "THIRD_PARTY_NOTICES.md"
          qualification = {
              "schema": "control-center.stable-qualification.v1",
              "version": version,
              "status": "PASS",
              "release_sha": release_sha,
              "qualification_run_id": run_id,
              "qualified_head_sha": qualified_head,
              "qualified_merge_sha": qualified_merge,
              "gates": {
                  "public_boundary": "PASS", "format": "PASS", "vet": "PASS", "race": "PASS", "build": "PASS",
                  "package_shape": "PASS", "clean_install": "PASS", "upgrade_from_0_30": "PASS",
                  "upgrade_from_0_31": "PASS", "migration_idempotency": "PASS"
              },
              "commercial_launch_authority": False,
          }
          qname = f"control-center-{version}.qualification.json"
          (out / qname).write_text(json.dumps(qualification, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          provenance = {
              "schema": "control-center.stable-provenance.v1",
              "version": version,
              "revision": release_sha,
              "source_repository": "ControlCenterSoft/control-center-stable",
              "qualification_run_id": run_id,
              "qualified_tree": qualified_merge,
              "subjects": [
                  {"name": binary, "digest": digest(binary)}, {"name": sidecar, "digest": digest(sidecar)},
                  {"name": source, "digest": digest(source)}, {"name": sbom_name, "digest": digest(sbom_name)},
                  {"name": notices, "digest": digest(notices)}, {"name": qname, "digest": digest(qname)},
              ],
          }
          pname = f"control-center-{version}.provenance.json"
          (out / pname).write_text(json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          rname = f"control-center-{version}.release-manifest.json"
          release_manifest = {
              "schema": "control-center.stable-release.v3",
              "version": version,
              "channel": "stable",
              "source_tag": f"v{version}",
              "source_commit": release_sha,
              "qualification_run_id": run_id,
              "qualification_result": "success",
              "artifacts": {}
          }
          for name in [binary, sidecar, source, sbom_name, notices, qname, pname]:
              release_manifest["artifacts"][name] = digest(name)
          (out / rname).write_text(json.dumps(release_manifest, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          (
            cd dist/publish
            sha256sum \
              "control-center-${RELEASE_VERSION}-linux-amd64.tar.gz" \
              "control-center-${RELEASE_VERSION}-linux-amd64.tar.gz.sha256" \
              "control-center-${RELEASE_VERSION}-source.tar.gz" \
              "control-center-${RELEASE_VERSION}.sbom.cdx.json" \
              THIRD_PARTY_NOTICES.md \
              "control-center-${RELEASE_VERSION}.qualification.json" \
              "control-center-${RELEASE_VERSION}.provenance.json" \
              "control-center-${RELEASE_VERSION}.release-manifest.json" > SHA256SUMS
          )
          test "$(find dist/publish -maxdepth 1 -type f | wc -l)" -eq 9

      - name: Publish immutable Stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="v${RELEASE_VERSION}"
          assets=(
            "dist/publish/control-center-${RELEASE_VERSION}-linux-amd64.tar.gz"
            "dist/publish/control-center-${RELEASE_VERSION}-linux-amd64.tar.gz.sha256"
            "dist/publish/control-center-${RELEASE_VERSION}-source.tar.gz"
            "dist/publish/control-center-${RELEASE_VERSION}.sbom.cdx.json"
            "dist/publish/THIRD_PARTY_NOTICES.md"
            "dist/publish/control-center-${RELEASE_VERSION}.qualification.json"
            "dist/publish/control-center-${RELEASE_VERSION}.provenance.json"
            "dist/publish/control-center-${RELEASE_VERSION}.release-manifest.json"
            "dist/publish/SHA256SUMS"
          )
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Control Center ${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md

      - name: Verify published tag, assets, checksums and package shape
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="v${RELEASE_VERSION}"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          test "$tag_sha" = "$RELEASE_SHA"
          release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '[.draft,.prerelease] | @tsv')"
          test "$release_state" = $'false\tfalse'
          rm -rf dist/published
          mkdir -p dist/published
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/published
          test "$(find dist/published -maxdepth 1 -type f | wc -l)" -eq 9
          (cd dist/published && sha256sum -c SHA256SUMS)
          bundle="control-center-${RELEASE_VERSION}"
          artifact="dist/published/${bundle}-linux-amd64.tar.gz"
          tar -tzf "$artifact" | grep -Fx "${bundle}/scripts/migrate.sh" >/dev/null
          tar -tzf "$artifact" | grep -Fx "${bundle}/bin/control-center" >/dev/null
          test "$(tar -xOf "$artifact" "${bundle}/VERSION" | tr -d '\r\n')" = "$RELEASE_VERSION"
          echo PUBLIC_STABLE_0_31_1=PASS
