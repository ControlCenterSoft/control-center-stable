name: Promote exact Control Center 0.24.0 tree

on:
  push:
    branches:
      - promotion/exact-tree-0.24.0-v2

permissions:
  contents: write
  actions: read

env:
  VERSION: 0.24.0
  UPSTREAM_REPOSITORY: ControlCenterSoft/control-center-development
  UPSTREAM_TAG: v0.24.0
  UPSTREAM_SHA: 5e6a6dcc41f9d81f028dab5291e87059a1dfeea3
  QUALIFICATION_RUN_ID: '34561438783'

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Verify qualification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          python3 - <<'PY'
          import json
          jobs = json.load(open('/tmp/jobs.json', encoding='utf-8')).get('jobs', [])
          prerequisite = [j for j in jobs if j.get('name') != 'promote-and-publish']
          assert len(prerequisite) == 14, len(prerequisite)
          assert all(j.get('conclusion') == 'success' for j in prerequisite)
          print('QUALIFICATION=PASS')
          PY

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: stable
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout immutable upstream tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(tr -d '\n' < source/VERSION)" = "$VERSION"
          git -C source tag --points-at HEAD | grep -Fx "$UPSTREAM_TAG"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true

      - name: Build promoted tree and verify it
        shell: bash
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: |
          set -Eeuo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/GEMINI.md' \
            --exclude='/config/' \
            --exclude='/deploy/' \
            --exclude='/scripts/' \
            --exclude='/INSTALL.md' \
            --exclude='/RELEASE_NOTES.md' \
            --exclude='/RELEASE-MANIFEST.json' \
            source/ stable/
          rm -f stable/GEMINI.md
          cd stable
          test "$(tr -d '\n' < VERSION)" = "$VERSION"
          make fmt-check
          go vet ./...
          go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1
          unset MIGRATION_INSTALL_DATABASE_URL
          go test -race -count=1 ./...
          make build

      - name: Commit exact promoted tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C stable config user.name "github-actions[bot]"
          git -C stable config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C stable add -A
          git -C stable commit -m "release: promote exact Control Center 0.24.0 source tree"
          git -C stable push origin HEAD:main
          sha="$(git -C stable rev-parse HEAD)"
          git -C stable push --force origin "$sha:refs/heads/release/0.24.0"
          echo "PROMOTED_SHA=$sha"
