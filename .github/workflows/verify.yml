name: Verify Control Center Stable

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stable-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release identity and public boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 - <<'PY'
          from pathlib import Path
          import re

          forbidden = [
              r'Home Center', r'ChatGPT', r'Codex', r'CI Fabric',
              r'AI Development Infrastructure',
              r'BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY',
              r'github_pat_[A-Za-z0-9_]+',
              r'gh[pousr]_[A-Za-z0-9_]{20,}',
              r'sk-(?:proj-)?[A-Za-z0-9_-]{24,}',
          ]
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if len(path.parts) >= 2 and path.parts[0] == '.github' and path.parts[1] == 'workflows':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pattern in forbidden:
                  if re.search(pattern, text, re.I):
                      failures.append((str(path), pattern))
          if failures:
              for item in failures:
                  print('PUBLIC_BOUNDARY_FAIL', *item)
              raise SystemExit(1)
          print('PUBLIC_BOUNDARY=PASS')
          PY

      - name: Format, vet, race-test and build
        shell: bash
        run: |
          set -Eeuo pipefail
          make fmt-check
          go vet ./...
          go test -race -count=1 ./...
          make build

      - name: Verify deterministic stable bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '\n' < VERSION)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" COMMIT="$GITHUB_SHA" bash scripts/build-release.sh
          (cd dist && sha256sum -c "control-center-${version}-linux-amd64.tar.gz.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-stable-${{ github.sha }}
          path: |
            dist/control-center-*-linux-amd64.tar.gz
            dist/control-center-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
