name: Finalize qualified Control Center Stable 0.24.0

on:
  push:
    branches:
      - promotion/finalize-0.24.0

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-control-center-stable-0.24.0
  cancel-in-progress: false

env:
  VERSION: 0.24.0
  UPSTREAM_REPOSITORY: ControlCenterSoft/control-center-development
  UPSTREAM_TAG: v0.24.0
  UPSTREAM_SHA: 5e6a6dcc41f9d81f028dab5291e87059a1dfeea3
  RELEASE_METADATA_SHA: b5b534e368acccbef7dc74f9aba4c954cb747798
  QUALIFICATION_RUN_ID: '34561438783'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Verify completed stable qualification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/jobs?per_page=100" > /tmp/qualification-jobs.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/qualification-jobs.json', encoding='utf-8'))
          jobs = data.get('jobs', [])
          prerequisite = [j for j in jobs if j.get('name') != 'promote-and-publish']
          failed = [(j.get('name'), j.get('conclusion')) for j in prerequisite if j.get('conclusion') != 'success']
          if len(prerequisite) != 14:
              raise SystemExit(f'expected 14 prerequisite qualification jobs, got {len(prerequisite)}')
          if failed:
              raise SystemExit(f'qualification prerequisites not green: {failed}')
          final = [j for j in jobs if j.get('name') == 'promote-and-publish']
          if len(final) != 1 or final[0].get('conclusion') != 'failure':
              raise SystemExit('expected exactly one packaging-stage failure from the recorded qualification run')
          print('QUALIFICATION_EVIDENCE=PASS')
          print('QUALIFICATION_RUN_ID=' + os.environ['QUALIFICATION_RUN_ID'])
          PY

      - name: Checkout current stable main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: stable
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact immutable upstream release
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet --branch "$UPSTREAM_TAG" --depth 1 "https://github.com/$UPSTREAM_REPOSITORY.git" source
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(tr -d '\n' < source/VERSION)" = "$VERSION"
          git -C source tag --points-at HEAD | grep -Fx "$UPSTREAM_TAG"
          test ! -f source/.env
          test ! -f source/.env.staging
          if grep -RInE --exclude-dir=.git --exclude='*.sum' --exclude='ci.yml' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16})' source; then
            echo 'official public-safety boundary failed for upstream source' >&2
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
          cache: true

      - name: Promote exact source tree and stable distribution overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='GEMINI.md' \
            --exclude='config/' \
            --exclude='deploy/' \
            --exclude='scripts/' \
            --exclude='INSTALL.md' \
            --exclude='RELEASE_NOTES.md' \
            --exclude='RELEASE-MANIFEST.json' \
            source/ stable/
          rm -f stable/GEMINI.md

          cat > stable/README.md <<'EOF'
          # Control Center 0.24.0 Stable

          Control Center is a self-contained infrastructure-management control plane. This repository is the stable binary distribution channel.

          ## Current stable release

          **0.24.0** is the current stable release. Product source is promoted from the immutable official source tag `ControlCenterSoft/control-center-development@v0.24.0`, commit `5e6a6dcc41f9d81f028dab5291e87059a1dfeea3`. The later commit `b5b534e368acccbef7dc74f9aba4c954cb747798` finalized release metadata only and did not change product code.

          The stable tree contains the exact promoted product source plus stable-only installation, packaging, service and update helpers.

          ## Authentication after a clean install

          A clean installation creates local user `admin` with initial password `admin`. The first successful login requires a password change before normal operation is allowed. Upgrading an existing installation does not reset the administrator password.

          ## Start here

          - [Installation and upgrade](INSTALL.md)
          - [Stable release notes](RELEASE_NOTES.md)
          - [Security](SECURITY.md)
          - [Architecture](ARCHITECTURE.md)
          - [Release manifest](RELEASE-MANIFEST.json)

          Stable release artifacts are published in GitHub Releases with SHA-256 checksums, qualification evidence and exact upstream provenance.
          EOF

          mkdir -p stable/config stable/deploy/systemd stable/scripts
          cat > stable/config/control-center.env.example <<'EOF'
          CC_LISTEN_ADDR=127.0.0.1:8080
          CC_ENVIRONMENT=production
          CC_LOG_LEVEL=info
          CC_DATABASE_URL=postgres://control_center:replace-with-database-password@db.example.invalid:5432/control_center?sslmode=require
          CC_RESOURCES_FILE=
          CC_AUTH_SESSION_TTL=8h
          CC_AUTH_SESSION_IDLE_TIMEOUT=2h
          PGHOST=db.example.invalid
          PGPORT=5432
          PGDATABASE=control_center
          PGUSER=control_center
          PGPASSWORD=replace-with-database-password
          EOF

          cat > stable/INSTALL.md <<'EOF'
          # Control Center 0.24.0 — installation and upgrade

          ## Requirements

          - Linux AMD64 with systemd;
          - PostgreSQL 15, 16, 17 or 18;
          - `psql` for applying database migrations;
          - TLS termination in front of Control Center for production access.

          ## Clean installation

          1. Download `control-center-0.24.0-linux-amd64.tar.gz` and verify it with the matching `.sha256` file or `SHA256SUMS`.
          2. Extract the bundle under `/opt/control-center/releases/0.24.0` and point `/opt/control-center/current` to that directory.
          3. Create the `control-center` service account and `/var/lib/control-center` working directory.
          4. Copy `config/control-center.env.example` to `/etc/control-center/control-center.env`, set the PostgreSQL connection and restrict file permissions.
          5. Back up PostgreSQL if the database is not empty, then apply all forward migrations through `scripts/migrate.sh`.
          6. Install `deploy/systemd/control-center.service`, reload systemd and start the service.
          7. Sign in as `admin` / `admin` and immediately complete the mandatory first-login password change.

          The supplied example binds to loopback by default. Do not expose the bootstrap credential on an untrusted network.

          ## Upgrade from an earlier stable release

          1. Back up PostgreSQL and the current Control Center configuration.
          2. Stop the service.
          3. Extract 0.24.0 into a new release directory.
          4. Apply forward migrations with the existing database credentials.
          5. Move `/opt/control-center/current` to 0.24.0 and start the service.
          6. Verify readiness, authentication, existing administrator access and critical managed-resource reads.

          The existing administrator password is preserved during upgrade and is not reset to `admin`.
          EOF

          cat > stable/RELEASE_NOTES.md <<'EOF'
          # Control Center 0.24.0 Stable

          Release status: **stable**.

          Stable 0.24.0 promotes the immutable official source tag `v0.24.0` (`5e6a6dcc41f9d81f028dab5291e87059a1dfeea3`) after independent stable qualification. Post-release metadata was finalized by `b5b534e368acccbef7dc74f9aba4c954cb747798`; that metadata commit did not change product code.

          The accumulated stable line includes the current local authentication and mandatory first-password-change model, session controls, RBAC/self-introspection, audit boundaries, lifecycle/recovery contracts, distributed-core and product API contracts, capacity/placement evidence contracts, and 0.24.0 bounded protection against password brute force and credential spraying.

          Stable qualification passed formatting/vet/unit/build gates; PostgreSQL 15–18 clean-install, supported-upgrade and adapter/restart checks; race detection; the canonical public-repository safety boundary; and deterministic Linux AMD64 packaging.

          For a clean installation the initial local credential is `admin` / `admin` and must be changed on first login. An upgrade preserves the existing administrator password.
          EOF

          cat > stable/RELEASE-MANIFEST.json <<'EOF'
          {
            "schema": "control-center.stable-release.v1",
            "version": "0.24.0",
            "channel": "stable",
            "upstream_repository": "ControlCenterSoft/control-center-development",
            "upstream_tag": "v0.24.0",
            "upstream_commit": "5e6a6dcc41f9d81f028dab5291e87059a1dfeea3",
            "release_metadata_commit": "b5b534e368acccbef7dc74f9aba4c954cb747798",
            "qualification_run_id": 34561438783
          }
          EOF

          cat > stable/scripts/build-release.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          cd "$repo_root"
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go_binary="${GO_BINARY:-go}"
          commit="${COMMIT:-$(git rev-parse HEAD 2>/dev/null || printf unknown)}"
          source_date_epoch="${SOURCE_DATE_EPOCH:-$(git show -s --format=%ct HEAD 2>/dev/null || printf 0)}"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          build_time="$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          dist_dir="${DIST_DIR:-$repo_root/dist}"
          mkdir -p "$dist_dir"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          bundle="control-center-$version"
          mkdir -p "$stage/$bundle/bin" "$stage/$bundle/api" "$stage/$bundle/config" "$stage/$bundle/deploy/systemd" "$stage/$bundle/migrations" "$stage/$bundle/scripts" "$stage/$bundle/docs"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 "$go_binary" build \
            -trimpath -buildvcs=false \
            -ldflags="-s -w -X control-center/internal/buildinfo.Version=$version -X control-center/internal/buildinfo.Commit=$commit -X control-center/internal/buildinfo.BuildTime=$build_time" \
            -o "$stage/$bundle/bin/control-center" ./cmd/control-center
          cp README.md INSTALL.md RELEASE_NOTES.md SECURITY.md ARCHITECTURE.md ROADMAP.md VERSION RELEASE-MANIFEST.json "$stage/$bundle/"
          cp -a api/. "$stage/$bundle/api/"
          cp config/control-center.env.example "$stage/$bundle/config/"
          cp deploy/systemd/control-center.service "$stage/$bundle/deploy/systemd/"
          find migrations -maxdepth 1 -type f \( -name '*.sql' -o -name 'README.md' \) -exec cp {} "$stage/$bundle/migrations/" \;
          cp scripts/migrate.sh "$stage/$bundle/scripts/"
          if [[ -d docs ]]; then cp -a docs/. "$stage/$bundle/docs/"; fi
          chmod 0755 "$stage/$bundle/bin/control-center" "$stage/$bundle/scripts/migrate.sh"
          artifact="$dist_dir/$bundle-linux-amd64.tar.gz"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -C "$stage" -czf "$artifact" "$bundle"
          (cd "$dist_dir" && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256")
          printf '%s\n' "$artifact" "$artifact.sha256"
          SCRIPT
          chmod 0755 stable/scripts/build-release.sh stable/scripts/migrate.sh

      - name: Verify promoted stable tree with canonical safety boundary
        working-directory: stable
        shell: bash
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\n' < VERSION)" = "$VERSION"
          test ! -e GEMINI.md
          test ! -f .env
          test ! -f .env.staging
          if grep -RInE --exclude-dir=.git --exclude-dir=workflows --exclude='*.sum' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16})' .; then
            echo 'stable public-safety scan detected credential-like material' >&2
            exit 1
          fi
          make fmt-check
          go vet ./...
          go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1
          go test -race -count=1 ./...
          make build

      - name: Commit promoted stable tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C stable config user.name "github-actions[bot]"
          git -C stable config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C stable add -A
          if ! git -C stable diff --cached --quiet; then
            git -C stable commit -m "release: promote Control Center 0.24.0 to stable"
            git -C stable push origin HEAD:main
          fi
          stable_sha="$(git -C stable rev-parse HEAD)"
          echo "STABLE_SHA=$stable_sha" >> "$GITHUB_ENV"
          git -C stable push --force origin "$stable_sha:refs/heads/release/0.24.0"

      - name: Build reproducible stable artifacts
        working-directory: stable
        shell: bash
        run: |
          set -Eeuo pipefail
          upstream_epoch="$(git -C ../source show -s --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$upstream_epoch" COMMIT="$UPSTREAM_SHA" bash scripts/build-release.sh
          (cd dist && sha256sum -c "control-center-${VERSION}-linux-amd64.tar.gz.sha256")
          git archive --format=tar.gz --prefix="control-center-${VERSION}-source/" -o "dist/control-center-${VERSION}-source.tar.gz" "$STABLE_SHA"
          python3 - <<'PY'
          import json, os
          data = {
              'schema': 'control-center.stable-release-evidence.v1',
              'version': os.environ['VERSION'],
              'stable_commit': os.environ['STABLE_SHA'],
              'upstream_repository': os.environ['UPSTREAM_REPOSITORY'],
              'upstream_tag': os.environ['UPSTREAM_TAG'],
              'upstream_commit': os.environ['UPSTREAM_SHA'],
              'release_metadata_commit': os.environ['RELEASE_METADATA_SHA'],
              'qualification_run_id': int(os.environ['QUALIFICATION_RUN_ID']),
              'finalization_run_id': int(os.environ['GITHUB_RUN_ID']),
              'qualification': 'passed'
          }
          path = f"dist/control-center-{os.environ['VERSION']}.release-manifest.json"
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
          python3 - <<'PY'
          import json, os
          data = {
              'schema': 'control-center.stable-qualification.v1',
              'version': os.environ['VERSION'],
              'qualification_run_id': int(os.environ['QUALIFICATION_RUN_ID']),
              'finalization_run_id': int(os.environ['GITHUB_RUN_ID']),
              'upstream_commit': os.environ['UPSTREAM_SHA'],
              'gates': {
                  'source_integrity': 'pass',
                  'format_vet_unit_build': 'pass',
                  'postgres_15_18_clean_install': 'pass',
                  'postgres_15_18_supported_upgrade': 'pass',
                  'postgres_15_18_adapters_restart': 'pass',
                  'race': 'pass',
                  'canonical_public_safety': 'pass',
                  'promoted_tree_reverify': 'pass'
              }
          }
          path = f"dist/control-center-{os.environ['VERSION']}.qualification.json"
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
          (cd dist && sha256sum \
            "control-center-${VERSION}-linux-amd64.tar.gz" \
            "control-center-${VERSION}-source.tar.gz" \
            "control-center-${VERSION}.release-manifest.json" \
            "control-center-${VERSION}.qualification.json" > SHA256SUMS)

      - name: Publish immutable stable tag and GitHub release
        working-directory: stable
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="v${VERSION}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$STABLE_SHA"
          else
            git tag -a "$tag" "$STABLE_SHA" -m "Control Center ${VERSION} stable"
            git push origin "$tag"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            test "$existing_target" = "$STABLE_SHA" || test "$existing_target" = "release/0.24.0"
            gh release upload "$tag" \
              "dist/control-center-${VERSION}-linux-amd64.tar.gz" \
              "dist/control-center-${VERSION}-linux-amd64.tar.gz.sha256" \
              "dist/control-center-${VERSION}-source.tar.gz" \
              "dist/control-center-${VERSION}.release-manifest.json" \
              "dist/control-center-${VERSION}.qualification.json" \
              "dist/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              "dist/control-center-${VERSION}-linux-amd64.tar.gz" \
              "dist/control-center-${VERSION}-linux-amd64.tar.gz.sha256" \
              "dist/control-center-${VERSION}-source.tar.gz" \
              "dist/control-center-${VERSION}.release-manifest.json" \
              "dist/control-center-${VERSION}.qualification.json" \
              "dist/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$STABLE_SHA" \
              --title "Control Center ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,targetCommitish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-center-stable-0.24.0-${{ github.run_id }}
          path: |
            stable/dist/control-center-0.24.0-linux-amd64.tar.gz
            stable/dist/control-center-0.24.0-linux-amd64.tar.gz.sha256
            stable/dist/control-center-0.24.0-source.tar.gz
            stable/dist/control-center-0.24.0.release-manifest.json
            stable/dist/control-center-0.24.0.qualification.json
            stable/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
