openapi: 3.1.0
info:
  title: Control Center Node Lifecycle API fragment
  version: 0.4.0
  description: >-
    Authenticated, fail-closed API for reading an immutable node lifecycle
    projection and validating a transition plan. Planning never writes state
    and never mutates a managed host. READY is the API name for the ACTIVE
    architecture state after enrollment and readiness verification.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/nodes/{nodeId}/lifecycle:
    get:
      operationId: getNodeLifecycle
      summary: Read the current lifecycle object
      x-control-center-permission: nodes.lifecycle.read
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Current versioned node lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeLifecycle'
        '400':
          description: Query parameters are not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ProjectionUnavailable'
  /api/v1/nodes/{nodeId}/lifecycle/transitions/plan:
    post:
      operationId: planNodeLifecycleTransition
      summary: Validate one guarded transition without executing it
      x-control-center-permission: nodes.lifecycle.plan
      description: >-
        The server validates the request against the current read-only
        projection. A successful response is plan-only: host_mutation and
        state_mutation are false. Execution remains unavailable until an
        audited Change/Job can revalidate the precondition atomically with a
        durable write.
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: Accepted non-mutating transition plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionPlan'
        '400':
          description: Invalid query or non-strict JSON request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Stale precondition or forbidden state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type is not application/json with optional UTF-8 charset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid precondition, reason or transition evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Transition plan could not be evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ProjectionUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    sessionCookie:
      type: apiKey
      in: cookie
      name: cc_session
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Stable Node ID; it must equal object_id in the lifecycle object.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
  responses:
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    Forbidden:
      description: The authenticated subject lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    NotFound:
      description: Node lifecycle does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: HTTP method is not supported for this resource
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProjectionUnavailable:
      description: Read-only lifecycle projection cannot be used safely
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LifecycleState:
      type: string
      enum:
        - discovered
        - enrolling
        - ready
        - degraded
        - draining
        - maintenance
        - updating
        - replacing
        - removing
        - offline
        - recovering
        - retired
    LifecycleTransitionType:
      type: string
      description: >-
        desired changes operator intent and generation; observation records
        progress or health without changing generation.
      enum: [desired, observation]
    LifecycleEvidenceCheck:
      type: string
      enum:
        - enrollment-authorized
        - identity-verified
        - readiness-passed
        - maintenance-preflight-passed
        - scheduling-disabled
        - scheduling-enabled
        - drain-complete
        - no-active-jobs
        - no-active-placements
        - stateful-workloads-safe
        - operation-approved
        - operation-cancelled
        - rollback-verified
        - update-verified
        - replacement-node-ready
        - state-synchronized
        - switchover-verified
        - replacement-health-verified
        - removal-approved
        - removal-verified
        - recovery-started
        - recovery-verified
        - retirement-approved
        - no-managed-state
    ObjectPrecondition:
      type: object
      additionalProperties: false
      required: [object_id, resource_version]
      properties:
        object_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
        resource_version:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^\S+$'
          description: Opaque token; clients must not parse or order it.
        generation:
          type: integer
          format: uint64
          minimum: 1
    TransitionEvidence:
      type: object
      additionalProperties: false
      properties:
        passed_checks:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LifecycleEvidenceCheck'
    LifecycleTransitionRequest:
      type: object
      additionalProperties: false
      required: [to, type, precondition, evidence]
      properties:
        to:
          $ref: '#/components/schemas/LifecycleState'
        type:
          $ref: '#/components/schemas/LifecycleTransitionType'
        reason:
          type: string
          maxLength: 512
          description: Required for degraded, offline, recovering and retired.
        precondition:
          $ref: '#/components/schemas/ObjectPrecondition'
        evidence:
          $ref: '#/components/schemas/TransitionEvidence'
      allOf:
        - if:
            properties:
              to:
                enum: [degraded, offline, recovering, retired]
          then:
            required: [reason]
            properties:
              reason:
                minLength: 1
        - if:
            properties:
              to:
                not:
                  enum: [degraded, offline, recovering, retired]
          then:
            properties:
              reason:
                maxLength: 0
    NodeLifecycle:
      type: object
      additionalProperties: false
      required:
        - object_id
        - scope_id
        - owner_scope
        - generation
        - resource_version
        - created_at
        - updated_at
        - state
        - state_changed_at
      properties:
        object_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
          description: Stable physical Node ID.
        scope_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
        owner_scope:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
        generation:
          type: integer
          format: uint64
          minimum: 1
        resource_version:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^\S+$'
          description: Opaque storage or synchronization version.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/LifecycleState'
        state_changed_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 512
      allOf:
        - if:
            properties:
              state:
                enum: [degraded, offline, recovering, retired]
          then:
            required: [reason]
            properties:
              reason:
                minLength: 1
        - if:
            properties:
              state:
                not:
                  enum: [degraded, offline, recovering, retired]
          then:
            properties:
              reason:
                maxLength: 0
    TransitionPlan:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - accepted
        - plan_only
        - host_mutation
        - state_mutation
        - requires_audited_change_job
        - node_id
        - from
        - to
        - type
        - current_generation
        - planned_generation
        - based_on_resource_version
        - required_checks
        - evaluated_at
      properties:
        plan_id:
          type: string
          pattern: '^nlp-[a-f0-9]{24}$'
        accepted:
          type: boolean
          const: true
        plan_only:
          type: boolean
          const: true
        host_mutation:
          type: boolean
          const: false
        state_mutation:
          type: boolean
          const: false
        requires_audited_change_job:
          type: boolean
          const: true
        node_id:
          type: string
        from:
          $ref: '#/components/schemas/LifecycleState'
        to:
          $ref: '#/components/schemas/LifecycleState'
        type:
          $ref: '#/components/schemas/LifecycleTransitionType'
        current_generation:
          type: integer
          format: uint64
          minimum: 1
        planned_generation:
          type: integer
          format: uint64
          minimum: 1
        based_on_resource_version:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^\S+$'
        required_checks:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LifecycleEvidenceCheck'
        evaluated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - method_not_allowed
                - invalid_query
                - json_required
                - invalid_request
                - request_too_large
                - node_lifecycle_not_found
                - lifecycle_projection_unavailable
                - invalid_node_lifecycle
                - invalid_precondition
                - precondition_failed
                - invalid_transition
                - invalid_transition_evidence
                - lifecycle_plan_failed
            message:
              type: string
    AuthErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              enum:
                - authentication_required
                - permission_denied
                - password_change_required
            message:
              type: string
            correlation_id:
              type: string
              minLength: 1
              maxLength: 128
