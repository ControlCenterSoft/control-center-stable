openapi: 3.1.0
info:
  title: Control Center State Surfaces API fragment
  version: 0.3.0
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/domain/join/validate:
    post:
      operationId: validateDomainJoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, provider, domain_name]
              properties:
                platform: { type: string, enum: [windows, linux] }
                provider: { type: string, enum: [samba-ad-dc, samba-ad, freeipa] }
                domain_name: { type: string, minLength: 1 }
      responses:
        '200': { description: Join request is valid }
        '422': { description: Join request is incompatible }
  /api/v1/domain/readiness/evaluate:
    post:
      operationId: evaluateDomainReadiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, dns_ready, time_sync_ready, storage_ready]
              properties:
                provider: { type: string, enum: [samba-ad-dc, samba-ad, freeipa] }
                dns_ready: { type: boolean }
                time_sync_ready: { type: boolean }
                storage_ready: { type: boolean }
      responses:
        '200': { description: Domain readiness result }
  /api/v1/inventory/observations:
    post:
      operationId: ingestInventoryObservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observations]
              properties:
                observations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/DeviceObservation' }
      responses:
        '200': { description: Reconciled inventory state }
  /api/v1/inventory/devices:
    get:
      operationId: listInventoryDevices
      responses:
        '200': { description: Inventory device snapshot }
  /api/v1/inventory/devices/{deviceId}:
    get:
      operationId: getInventoryDevice
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Inventory device }
        '404': { description: Device not found }
  /api/v1/agent/enrollments:
    post:
      operationId: enrollAgentNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Enrollment' }
      responses:
        '200': { description: Agent node state }
  /api/v1/agent/heartbeats:
    post:
      operationId: recordAgentHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node_id, seen_at]
              properties:
                node_id: { type: string, minLength: 1 }
                seen_at: { type: string, format: date-time }
      responses:
        '200': { description: Updated agent node state }
        '404': { description: Node not enrolled }
        '422': { description: Heartbeat is invalid or non-monotonic }
  /api/v1/agent/nodes:
    get:
      operationId: listAgentNodes
      responses:
        '200': { description: Agent fleet snapshot }
  /api/v1/agent/nodes/{nodeId}:
    get:
      operationId: getAgentNode
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Agent node state }
        '404': { description: Node not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: opaque-session-token }
    sessionCookie: { type: apiKey, in: cookie, name: cc_session }
  schemas:
    DeviceObservation:
      type: object
      additionalProperties: false
      required: [device_id, source, hostname, seen_at]
      properties:
        device_id: { type: string, minLength: 1 }
        source: { type: string, minLength: 1 }
        hostname: { type: string }
        seen_at: { type: string, format: date-time }
    Enrollment:
      type: object
      additionalProperties: false
      required: [node_id, hostname]
      properties:
        node_id: { type: string, minLength: 1 }
        hostname: { type: string, minLength: 1 }
        capabilities: { type: array, items: { type: string } }
    Overview:
      type: object
      required: [status, cards]
      properties:
        status: { type: string, enum: [ready, attention, degraded] }
        cards:
          type: array
          items:
            type: object
            required: [id, status, values]
            properties:
              id: { type: string }
              status: { type: string }
              values: { type: object, additionalProperties: true }
